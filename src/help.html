<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Help Center — Gemini Export</title>
  <link rel="stylesheet" href="help.css">
  <link rel="icon" href="../images/store-icon-128.png">
</head>
<body>
  <div class="help-page">
    <!-- Header -->
    <header class="help-header">
      <div class="help-header-inner">
        <div class="help-header-brand">
          <img src="../images/store-icon-48.png" alt="" class="help-header-logo">
          <div class="help-header-titles">
            <h1 data-i18n="help_page_title">Help Center</h1>
            <p data-i18n="help_page_subtitle">Find answers to common questions about exporting, Notion &amp; Obsidian sync</p>
          </div>
        </div>
        <div class="help-header-tools">
          <div class="help-search-wrap">
            <svg class="help-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="search" id="help-search-input" class="help-search-input" data-i18n-placeholder="help_search_placeholder" placeholder="Search questions...">
          </div>
          <select id="help-language-select" class="help-language-select" aria-label="Language">
            <option value="system" data-i18n="popup_language_system">System</option>
            <option value="en">English</option>
            <option value="zh_CN">简体中文</option>
            <option value="zh_TW">繁體中文</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="de">Deutsch</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
            <option value="pt_BR">Português (Brasil)</option>
          </select>
        </div>
      </div>
    </header>

    <!-- Main Layout -->
    <div class="help-body">
      <!-- Sidebar Nav -->
      <nav class="help-sidebar" id="help-sidebar">
        <a href="#export" class="help-nav-item active" data-category="export">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span data-i18n="help_category_export">Export Methods</span>
        </a>
        <a href="#notion" class="help-nav-item" data-category="notion">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="9" x2="15" y2="15"></line>
            <line x1="15" y1="9" x2="9" y2="15"></line>
          </svg>
          <span data-i18n="help_category_notion">Notion Sync</span>
        </a>
        <a href="#obsidian" class="help-nav-item" data-category="obsidian">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
          </svg>
          <span data-i18n="help_category_obsidian">Obsidian Sync</span>
        </a>
        <a href="#general" class="help-nav-item" data-category="general">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
          <span data-i18n="help_category_general">General Questions</span>
        </a>
      </nav>

      <!-- Content Area -->
      <main class="help-content" id="help-content">
        <!-- Q&A sections rendered dynamically by help.js -->
        <div class="help-loading" id="help-loading">
          <div class="help-spinner"></div>
          <p data-i18n="help_loading">Loading...</p>
        </div>
      </main>
    </div>

    <!-- Footer -->
    <footer class="help-footer">
      <div class="help-footer-inner">
        <p data-i18n="help_footer_contact">Still need help? Contact us:</p>
        <a href="mailto:chatvaultaisupport@gmail.com" class="help-footer-email">chatvaultaisupport@gmail.com</a>
      </div>
    </footer>
  </div>

  <script src="product-config.js"></script>
  <script src="modules/i18n.js"></script>
  <script src="help.js"></script>
</body>
</html>
